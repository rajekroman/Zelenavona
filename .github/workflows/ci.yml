name: V7 CI

on:
  push:
    branches: [main, "v7/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check src/main.js
          node --check src/camera.js
          node --check src/world.js
      - name: Unit tests
        run: npm test
