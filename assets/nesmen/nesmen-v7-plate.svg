    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="soft"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
  </filter>
  <filter id="moss"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="15" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18"/></filter>
</defs>

