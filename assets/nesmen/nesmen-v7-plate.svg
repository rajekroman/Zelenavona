  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee6b8" stop-opacity=".52"/><stop offset=".55" stop-color="#ddd59d" stop-opacity=".18"/><stop offset="1" stop-color="#d8d8a5" stop-opacity="0"/></linearGradient>
  <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c09a66"/><stop offset=".28" stop-color="#977648"/><stop offset=".58" stop-color="#735838"/><stop offset="1" stop-color="#443927"/></linearGradient>
