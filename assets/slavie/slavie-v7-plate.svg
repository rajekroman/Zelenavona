<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440">
<defs>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#87966f"/><stop offset="1" stop-color="#667356"/></linearGradient>
  <linearGradient id="dirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8865f"/><stop offset="1" stop-color="#78634d"/></linearGradient>
  <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3eee0"/><stop offset="1" stop-color="#d3c9b3"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#273025" flood-opacity=".34"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="9" result="n"/><feComponentTransfer in="n"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
<rect width="1920" height="1440" fill="#b9c2ae"/>
<path d="M0 250c270-95 528-81 785 16 240-92 513-88 1135 14v260H0z" fill="#5e755e" opacity=".7"/>
<path d="M0 420c248-78 455-48 684 22 264-73 516-67 760 17 184-55 344-45 476-13v210H0z" fill="#456147"/>
<rect y="520" width="1920" height="920" fill="url(#grass)" filter="url(#grain)"/>

<!-- open trampled event ground -->
<path d="M180 720c260-105 563-130 875-83 274 42 502 133 685 271-172 191-440 316-760 355-323 39-612-7-862-138 19-169 39-284 62-405z" fill="url(#dirt)" opacity=".86"/>
<path d="M245 810c220-71 452-88 695-52 241 36 449 113 624 230-172 129-381 211-626 237-269 28-514-4-735-99 11-107 25-213 42-316z" fill="#9b7c5b" opacity=".44"/>

<!-- small Slávie backdrop in top-right corner only -->
