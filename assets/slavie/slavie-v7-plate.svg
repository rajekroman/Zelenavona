  <rect x="0" y="0" width="360" height="220" rx="8" fill="#e7e0cf" stroke="#5a564d" stroke-width="7"/>
  <path d="M-18 18L180-58 378 18z" fill="#7e3833" stroke="#4d2e2b" stroke-width="7"/>
  <rect x="48" y="62" width="68" height="78" fill="#80939a"/><rect x="145" y="62" width="68" height="78" fill="#80939a"/><rect x="242" y="62" width="68" height="78" fill="#80939a"/>
  <rect x="145" y="146" width="76" height="74" fill="#5e4b3b"/>
  <rect x="24" y="16" width="130" height="34" rx="5" fill="#f2efe6"/><text x="89" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7e3833">SLÁVIE</text>
</g>

<!-- stalls / tents around perimeter -->
<g filter="url(#shadow)">
  <g transform="translate(260 610)"><path d="M0 82L92 0l92 82z" fill="url(#tent)" stroke="#675f50" stroke-width="6"/><rect x="20" y="82" width="144" height="118" fill="#d5ccba" stroke="#675f50" stroke-width="6"/><rect x="30" y="116" width="124" height="38" fill="#7b5f45"/></g>
  <g transform="translate(620 585)"><path d="M0 78L84 0l84 78z" fill="#d8e0d6" stroke="#536253" stroke-width="6"/><rect x="18" y="78" width="132" height="110" fill="#c7d1c4" stroke="#536253" stroke-width="6"/><rect x="31" y="110" width="106" height="34" fill="#6e795f"/></g>
  <g transform="translate(1100 600)"><path d="M0 80L88 0l88 80z" fill="#ede4d0" stroke="#665d4e" stroke-width="6"/><rect x="20" y="80" width="136" height="112" fill="#d9ccb4" stroke="#665d4e" stroke-width="6"/><rect x="33" y="113" width="110" height="34" fill="#8b694b"/></g>
</g>

<!-- vans / parking edges -->
