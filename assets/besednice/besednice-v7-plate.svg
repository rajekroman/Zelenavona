<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9da8a0"/><stop offset="1" stop-color="#c8c2a8"/></linearGradient>
  <linearGradient id="pit" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a78457"/><stop offset=".32" stop-color="#8b6847"/><stop offset=".7" stop-color="#6f543c"/><stop offset="1" stop-color="#554538"/></linearGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bc795d"/><stop offset=".48" stop-color="#9b5f4e"/><stop offset="1" stop-color="#71473c"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6b579"/><stop offset="1" stop-color="#b58b56"/></linearGradient>
  <radialGradient id="water"><stop stop-color="#b6c0b8" stop-opacity=".55"/><stop offset=".58" stop-color="#778c85" stop-opacity=".38"/><stop offset="1" stop-color="#4d625b" stop-opacity=".18"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#32261d" flood-opacity=".35"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="17" result="n"/><feComponentTransfer in="n"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
</defs>
<rect width="1920" height="1440" fill="url(#sky)"/>
